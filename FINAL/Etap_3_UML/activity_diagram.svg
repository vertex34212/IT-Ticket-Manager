<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1450" viewBox="0 0 1600 1450"><rect width="100%" height="100%" fill="#FFFFFF"/><style>.a{fill:#F6F9FC;stroke:#2F5D7E;stroke-width:2}.d{fill:#FFF7E6;stroke:#B7791F;stroke-width:2}.l{stroke:#52606D;stroke-width:2;fill:none;marker-end:url(#arr)}.lane{stroke:#AAB7C4;stroke-width:2;fill:#FBFCFE}</style><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#52606D"/></marker></defs><text x="800" y="48" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="middle" fill="#182A3A">IT Ticket Manager — диаграмма активности</text><rect class="lane" x="0" y="80" width="520" height="1320"/><text x="260" y="112" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="middle" fill="#182A3A">Пользователь</text><rect class="lane" x="520" y="80" width="540" height="1320"/><text x="790" y="112" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="middle" fill="#182A3A">Система</text><rect class="lane" x="1060" y="80" width="540" height="1320"/><text x="1330" y="112" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="middle" fill="#182A3A">IT-техник</text><rect class="a" x="130" y="145" width="260" height="64" rx="12"/><text x="260.0" y="183.0" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="middle" fill="#182A3A">Создать заявку</text><rect class="a" x="650" y="145" width="300" height="64" rx="12"/><text x="800.0" y="183.0" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="middle" fill="#182A3A">Проверить данные</text><rect class="a" x="1140" y="145" width="300" height="64" rx="12"/><text x="1290.0" y="183.0" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="middle" fill="#182A3A">Принять заявку в работу</text><rect class="a" x="650" y="300" width="300" height="64" rx="12"/><text x="800.0" y="328.0" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="middle" fill="#182A3A">Зарегистрировать</text><text x="800.0" y="348.0" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="middle" fill="#182A3A">статус «Открыта»</text><rect class="a" x="1140" y="300" width="300" height="64" rx="12"/><text x="1290.0" y="328.0" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="middle" fill="#182A3A">Решить проблему и</text><text x="1290.0" y="348.0" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="middle" fill="#182A3A">указать результат</text><rect class="a" x="130" y="455" width="260" height="64" rx="12"/><text x="260.0" y="493.0" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="middle" fill="#182A3A">Проверить результат</text><rect class="a" x="650" y="455" width="300" height="64" rx="12"/><text x="800.0" y="483.0" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="middle" fill="#182A3A">Сохранить решение</text><text x="800.0" y="503.0" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="middle" fill="#182A3A">и создать email-событие</text><rect class="a" x="1140" y="455" width="300" height="64" rx="12"/><text x="1290.0" y="493.0" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="middle" fill="#182A3A">Перевести в «Решена»</text><rect class="d" x="130" y="610" width="260" height="64" rx="12"/><text x="260.0" y="638.0" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="middle" fill="#182A3A">Подтвердить или</text><text x="260.0" y="658.0" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="middle" fill="#182A3A">отклонить решение</text><rect class="a" x="650" y="610" width="300" height="64" rx="12"/><text x="800.0" y="638.0" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="middle" fill="#182A3A">Записать событие</text><text x="800.0" y="658.0" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="middle" fill="#182A3A">подтверждения/отказа</text><rect class="a" x="1140" y="610" width="300" height="64" rx="12"/><text x="1290.0" y="638.0" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="middle" fill="#182A3A">Закрыть заявку</text><text x="1290.0" y="658.0" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="middle" fill="#182A3A">после подтверждения</text><rect class="d" x="650" y="765" width="300" height="64" rx="12"/><text x="800.0" y="793.0" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="middle" fill="#182A3A">Вернуть статус</text><text x="800.0" y="813.0" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="middle" fill="#182A3A">«В работе» при отказе</text><rect class="d" x="1140" y="765" width="300" height="64" rx="12"/><text x="1290.0" y="793.0" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="middle" fill="#182A3A">Уточнить описание</text><text x="1290.0" y="813.0" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="middle" fill="#182A3A">и продолжить работу</text><rect class="a" x="650" y="920" width="300" height="64" rx="12"/><text x="800.0" y="948.0" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="middle" fill="#182A3A">Создать email-событие</text><text x="800.0" y="968.0" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="middle" fill="#182A3A">об изменении статуса</text><rect class="a" x="1140" y="920" width="300" height="64" rx="12"/><text x="1290.0" y="948.0" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="middle" fill="#182A3A">Повторно обработать</text><text x="1290.0" y="968.0" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="middle" fill="#182A3A">заявку</text><line class="l" x1="390" y1="177" x2="650" y2="177"/><line class="l" x1="950" y1="177" x2="1140" y2="177"/><line class="l" x1="1290" y1="209" x2="1290" y2="300"/><line class="l" x1="1140" y1="332" x2="950" y2="332"/><line class="l" x1="650" y1="332" x2="520" y2="332"/><line class="l" x1="520" y1="332" x2="520" y2="487"/><line class="l" x1="390" y1="487" x2="650" y2="487"/><line class="l" x1="950" y1="487" x2="1140" y2="487"/><line class="l" x1="1290" y1="519" x2="1290" y2="610"/><line class="l" x1="390" y1="642" x2="650" y2="642"/><line class="l" x1="950" y1="642" x2="1140" y2="642"/><line class="l" x1="650" y1="674" x2="520" y2="765"/><line class="l" x1="950" y1="797" x2="1140" y2="797"/><line class="l" x1="1290" y1="829" x2="1290" y2="920"/><line class="l" x1="950" y1="952" x2="1290" y2="952"/><text x="800" y="1035" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="middle" fill="#7B4A00">Развилка: подтверждение фиксируется как событие, а не как отдельный статус.</text><circle cx="140" cy="1100" r="20" fill="#243B53"/><line class="l" x1="160" y1="1100" x2="650" y2="1100"/><rect class="a" x="650" y="1060" width="300" height="64" rx="12"/><text x="800.0" y="1098.0" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="middle" fill="#182A3A">Заявка закрыта</text><circle cx="1300" cy="1100" r="20" fill="#FFFFFF" stroke="#243B53" stroke-width="5"/></svg>